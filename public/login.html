<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gestão SST — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous"/>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Inter',system-ui,sans-serif;
      background:#F1F5F9;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      -webkit-font-smoothing:antialiased;
    }
    .login-wrap {
      width:100%;
      max-width:420px;
      padding:24px;
    }
    .login-logo {
      text-align:center;
      margin-bottom:32px;
    }
    .logo-icon {
      width:60px; height:60px;
      background:linear-gradient(135deg,#4F46E5,#818CF8);
      border-radius:16px;
      display:inline-flex; align-items:center; justify-content:center;
      font-size:28px; color:#fff;
      box-shadow:0 8px 24px rgba(79,70,229,.35);
      margin-bottom:16px;
    }
    .login-logo h1 { font-size:24px; font-weight:800; color:#0F172A; letter-spacing:-.5px; }
    .login-logo p  { font-size:13.5px; color:#94A3B8; margin-top:4px; }

    .login-card {
      background:#fff;
      border-radius:16px;
      padding:32px;
      box-shadow:0 4px 24px rgba(0,0,0,.08), 0 1px 4px rgba(0,0,0,.04);
      border:1px solid #E2E8F0;
    }
    .login-card h2 { font-size:18px; font-weight:700; color:#0F172A; margin-bottom:6px; }
    .login-card .sub { font-size:13px; color:#94A3B8; margin-bottom:24px; }

    .field { margin-bottom:16px; }
    .field label {
      display:block; font-size:11.5px; font-weight:600;
      color:#475569; text-transform:uppercase; letter-spacing:.5px; margin-bottom:7px;
    }
    .input-wrap { position:relative; }
    .input-wrap i { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:#94A3B8; font-size:13px; }
    .field input {
      width:100%; padding:11px 13px 11px 38px;
      border:1.5px solid #E2E8F0; border-radius:9px;
      font-size:14px; color:#0F172A; background:#fff;
      outline:none; font-family:inherit; font-weight:500;
      transition:border-color .15s, box-shadow .15s;
    }
    .field input:focus { border-color:#4F46E5; box-shadow:0 0 0 3px rgba(79,70,229,.12); }

    .btn-login {
      width:100%; padding:12px;
      background:linear-gradient(135deg,#4F46E5,#818CF8);
      color:#fff; border:none; border-radius:10px;
      font-size:14.5px; font-weight:700; cursor:pointer;
      font-family:inherit; margin-top:8px;
      box-shadow:0 4px 12px rgba(79,70,229,.35);
      transition:all .2s;
    }
    .btn-login:hover { transform:translateY(-1px); box-shadow:0 6px 20px rgba(79,70,229,.45); }
    .btn-login:disabled { opacity:.6; cursor:not-allowed; transform:none; }

    .error-msg {
      background:#FEF2F2; border:1px solid #FECACA;
      color:#DC2626; font-size:13px; font-weight:500;
      padding:10px 14px; border-radius:9px;
      margin-bottom:16px; display:none;
    }
    .error-msg.show { display:block; }

    .login-footer { text-align:center; margin-top:20px; font-size:12px; color:#CBD5E1; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <div class="logo-icon"><i class="fa-solid fa-shield-halved"></i></div>
      <h1>Gestão SST</h1>
      <p>Saúde e Segurança do Trabalho</p>
    </div>

    <div class="login-card">
      <h2>Bem-vindo de volta</h2>
      <p class="sub">Entre com suas credenciais para acessar</p>

      <div class="error-msg" id="error-msg">Usuário ou senha incorretos.</div>

      <form onsubmit="login(event)">
        <div class="field">
          <label>Usuário</label>
          <div class="input-wrap">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" placeholder="seu usuário" autocomplete="username" required/>
          </div>
        </div>
        <div class="field">
          <label>Senha</label>
          <div class="input-wrap">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required/>
          </div>
        </div>
        <button class="btn-login" type="submit" id="btn-login">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar
        </button>
      </form>
    </div>

    <div class="login-footer">Gestão SST &copy; 2025</div>
  </div>

  <script>
    // Se já tem token válido, vai direto pro app
    if (localStorage.getItem('sst_token')) {
      window.location.href = '/app';
    }

    async function login(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const err = document.getElementById('error-msg');
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Entrando...';
      err.classList.remove('show');

      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro ao entrar');

        localStorage.setItem('sst_token', data.token);
        localStorage.setItem('sst_user', data.username);
        window.location.href = '/app';
      } catch (error) {
        err.textContent = error.message;
        err.classList.add('show');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Entrar';
      }
    }
  </script>
</body>
</html>
